services:
    db_alerta_temprana:
        image: postgres
        restart: always
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: password
            POSTGRES_DB: db_alerta_temprana
        ports:
            - 5432:5432
        volumes:
            - datos_sql:/var/lib/postgresql
            - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    adminer:
        image: adminer
        restart: always
        ports:
            - 8080:8080
    api_alerta_temprana:
        build: ./server
        container_name: api_alerta_temprana
        ports:
            - 3000:3000
        depends_on:
            - db_alerta_temprana
        environment:
            - JWT_SECRET=a3f8c2e1d4b7a9f0e2c5d8b1a4f7c0e3d6b9a2f5c8e1d4b7a0f3c6e9d2b5a8f1c4e7d0b3a6f9
            - DB_HOST=db_alerta_temprana
            - DB_USER=user
            - DB_PASSWORD=password
            - DB_NAME=db_alerta_temprana
volumes:
    datos_sql: